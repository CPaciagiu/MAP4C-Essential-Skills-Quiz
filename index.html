<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAP4C Essential Skills Diagnostic</title>
<style>
body {
  font-family: Arial, sans-serif;
  max-width: 850px;
  margin: 30px auto;
  padding: 0 20px;
  line-height: 1.5;
  color: #222;
}
h1 { margin-bottom: 8px; }
.question {
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 16px;
  margin: 16px 0;
}
.option {
  display: block;
  margin: 9px 0;
  padding: 7px;
}
input[type="text"] {
  padding: 9px;
  width: 100%;
  max-width: 450px;
  font-size: 16px;
  box-sizing: border-box;
}
button {
  padding: 12px 18px;
  font-size: 16px;
  border: 0;
  border-radius: 6px;
  cursor: pointer;
  margin: 8px 8px 8px 0;
}
#submitBtn {
  background: #333;
  color: white;
}
#downloadBtn {
  background: #555;
  color: white;
}
#results {
  display: none;
  border-top: 3px solid #333;
  margin-top: 30px;
  padding-top: 20px;
}
.correct {
  background: #e8f5e9;
  padding: 10px;
  border-radius: 5px;
  margin: 10px 0;
}
.incorrect {
  background: #ffebee;
  padding: 10px;
  border-radius: 5px;
  margin: 10px 0;
}
.small {
  font-size: 14px;
  color: #555;
}
</style>
</head>

<body>

<h1>MAP4C Essential Skills Diagnostic</h1>

<p>
Enter your name and answer all 15 questions.
When you submit, you will immediately see your score and feedback.
</p>

<label for="studentName"><strong>Enter your name</strong></label><br>
<input id="studentName" type="text" placeholder="Your name">

<form id="quizForm"></form>

<button id="submitBtn" type="button">Submit Quiz</button>

<div id="results"></div>

<script>

const questions = [

{
q:"Calculate: -7 + 12",
options:["5","-5","19","-19"],
answer:0,
feedback:"Add 12 to -7: -7 + 12 = 5."
},

{
q:"Calculate: 18 - 3 × 4",
options:["60","6","12","15"],
answer:1,
feedback:"Multiply first: 3 × 4 = 12, then 18 - 12 = 6."
},

{
q:"Calculate: 3/4 + 1/8",
options:["7/8","4/12","5/8","1"],
answer:0,
feedback:"Convert 3/4 to 6/8, then 6/8 + 1/8 = 7/8."
},

{
q:"What is 15% of 240?",
options:["24","30","36","40"],
answer:2,
feedback:"15% of 240 = 0.15 × 240 = 36."
},

{
q:"A recipe uses 2 cups of flour for 8 servings. How much flour is needed for 12 servings?",
options:["2.5 cups","3 cups","3.5 cups","4 cups"],
answer:1,
feedback:"The recipe uses 1/4 cup per serving. For 12 servings: 12 × 1/4 = 3 cups."
},

{
q:"Simplify: 4x + 7 - 2x + 3",
options:["2x + 10","6x + 10","2x + 4","6x + 4"],
answer:0,
feedback:"Combine like terms: 4x - 2x = 2x and 7 + 3 = 10."
},

{
q:"Solve: 3x - 5 = 16",
options:["x = 5","x = 6","x = 7","x = 8"],
answer:2,
feedback:"Add 5 to both sides: 3x = 21, so x = 7."
},

{
q:"Rearrange the formula A = lw to solve for w.",
options:["w = A/l","w = Al","w = l/A","w = A - l"],
answer:0,
feedback:"Divide both sides by l: w = A/l."
},

{
q:"If f(x) = 2x + 3, what is f(5)?",
options:["10","11","13","15"],
answer:2,
feedback:"Substitute x = 5: f(5) = 2(5) + 3 = 13."
},

{
q:"What is the slope of the line passing through (2, 3) and (6, 11)?",
options:["1","2","3","4"],
answer:1,
feedback:"m = (11 - 3)/(6 - 2) = 8/4 = 2."
},

{
q:"Which equation has slope -2 and y-intercept 5?",
options:["y = 2x + 5","y = -2x + 5","y = -2x - 5","y = 5x - 2"],
answer:1,
feedback:"In y = mx + b, m is the slope and b is the y-intercept. Therefore y = -2x + 5."
},

{
q:"A graph shows that a quantity increases from 20 to 50 when x increases from 2 to 8. What is the average rate of change?",
options:["3 units per x","4 units per x","5 units per x","6 units per x"],
answer:2,
feedback:"Average rate of change = (50 - 20)/(8 - 2) = 30/6 = 5 units per x."
},

{
q:"Convert 2.5 metres to centimetres.",
options:["25 cm","250 cm","2500 cm","0.25 cm"],
answer:1,
feedback:"1 metre = 100 centimetres, so 2.5 metres = 250 centimetres."
},

{
q:"A $1,000 investment earns 4% simple interest for 2 years. How much interest is earned?",
options:["$40","$60","$80","$1,040"],
answer:2,
feedback:"Simple interest I = Prt = 1000 × 0.04 × 2 = $80."
},

{
q:"A phone plan charges $25 per month plus $0.10 per text message. What is the monthly cost for 300 texts?",
options:["$45","$50","$55","$60"],
answer:2,
feedback:"Cost = 25 + 0.10(300) = 25 + 30 = $55."
}

];

const form = document.getElementById("quizForm");

questions.forEach((item, i) => {

  const div = document.createElement("div");
  div.className = "question";

  let options = "";

  item.options.forEach((option, j) => {

    options += `
      <label class="option">
        <input type="radio" name="q${i}" value="${j}">
        ${option}
      </label>
    `;

  });

  div.innerHTML = `
    <strong>${i + 1}. ${item.q}</strong>
    ${options}
  `;

  form.appendChild(div);

});


document.getElementById("submitBtn").addEventListener("click", function() {

  const name = document.getElementById("studentName").value.trim();

  if (!name) {
    alert("Please enter your name.");
    return;
  }

  let unanswered = [];

  for (let i = 0; i < questions.length; i++) {

    if (!document.querySelector(`input[name="q${i}"]:checked`)) {
      unanswered.push(i + 1);
    }

  }

  if (unanswered.length > 0) {

    alert(
      "Please answer all questions before submitting.\n\n" +
      "Missing question(s): " +
      unanswered.join(", ")
    );

    return;
  }

  let score = 0;
  let reportRows = [];

  questions.forEach((item, i) => {

    const selected =
      Number(document.querySelector(`input[name="q${i}"]:checked`).value);

    const correct = selected === item.answer;

    if (correct) {
      score++;
    }

  reportRows.push({

      number: i + 1,
      question: item.q,
      options: item.options,
      student: item.options[selected],
      correctAnswer: item.options[item.answer],
      isCorrect: correct,
      feedback: item.feedback

});

  });

  const percent =
    Math.round(score / questions.length * 100);

  const now = new Date();
  const dateTime = now.toLocaleString();

  let html = `

    <h2>Results</h2>

    <p>
      <strong>${escapeHtml(name)}</strong>
    </p>

    <p class="small">
      Completed: ${escapeHtml(dateTime)}
    </p>

    <h3>
      Score: ${score}/${questions.length} (${percent}%)
    </h3>

  `;

 reportRows.forEach(r => {

  let choices = "";

  r.options.forEach((option, index) => {

    const letter = String.fromCharCode(65 + index);

    const isSelected = option === r.student;
    const isCorrectAnswer = option === r.correctAnswer;

    let marker = "";

    if (isSelected && isCorrectAnswer) {
      marker = " ✓ Student's answer — CORRECT";
    } else if (isSelected) {
      marker = " ✗ Student's answer";
    }

    choices += `
      <div style="margin:6px 0;">
        <strong>${letter}.</strong>
        ${escapeHtml(option)}
        ${marker}
      </div>
    `;

  });

  html += `

    <div class="${r.isCorrect ? "correct" : "incorrect"}">

      <strong>
        Q${r.number}. ${escapeHtml(r.question)}
      </strong>

      <div style="margin-top:10px;">
        ${choices}
      </div>

      <p>
        <strong>Correct answer:</strong>
        ${escapeHtml(r.correctAnswer)}
      </p>

      <p>
        ${escapeHtml(r.feedback)}
      </p>

    </div>

  `;

});
  html += `

    <button id="downloadBtn" type="button">
      Download My Results
    </button>

    <p class="small">
      Download this report and upload it to Google Classroom
      as instructed by your teacher.
    </p>

  `;

  const results = document.getElementById("results");

  results.innerHTML = html;
  results.style.display = "block";

  results.scrollIntoView({
    behavior: "smooth"
  });

  window.lastReport =
    buildReport(name, dateTime, score, percent, reportRows);

});


function escapeHtml(str) {

  return String(str).replace(/[&<>"']/g, function(c) {

    return {

      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"

    }[c];

  });

}


function buildReport(name, dateTime, score, percent, rows) {

  let report =

`MAP4C ESSENTIAL SKILLS DIAGNOSTIC

Student: ${name}
Completed: ${dateTime}
Score: ${score}/${questions.length} (${percent}%)

`;

  rows.forEach(r => {

    report +=

`QUESTION ${r.number}

${r.question}

Student's answer: ${r.student}

Correct answer: ${r.correctAnswer}

Result: ${r.isCorrect ? "CORRECT" : "INCORRECT"}

Feedback: ${r.feedback}


`;

  });

  return report;

}


document.getElementById("results").addEventListener("click", function(e) {

  if (e.target.id === "downloadBtn") {

    const name = document.getElementById("studentName").value.trim();

    const printWindow = window.open("", "_blank");

    printWindow.document.write(`
      <!DOCTYPE html>
      <html>
      <head>
        <title>MAP4C Essential Skills Diagnostic - ${escapeHtml(name)}</title>

        <style>

          body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
            color: #222;
            line-height: 1.5;
          }

          h1 {
            text-align: center;
            margin-bottom: 5px;
          }

          .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
          }

          .student-info {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 6px;
          }

          .score {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            border: 2px solid #333;
            padding: 15px;
            margin-bottom: 25px;
          }

          .question {
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 14px;
            margin: 14px 0;
            page-break-inside: avoid;
          }

          .correct {
            border-left: 6px solid #333;
          }

          .incorrect {
            border-left: 6px solid #777;
          }

          .answer {
            margin-top: 8px;
          }

          .feedback {
            margin-top: 8px;
            font-size: 14px;
          }

          .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #666;
            text-align: center;
          }

          @media print {

            body {
              margin: 0;
              max-width: none;
            }

            button {
              display: none;
            }

          }

        </style>

      </head>

      <body>

        <h1>MAP4C Essential Skills Diagnostic</h1>

        <div class="subtitle">
          Completed Quiz Report
        </div>

        <div class="student-info">
          <strong>Student:</strong> ${escapeHtml(name)}<br>
          <strong>Date and time:</strong> ${escapeHtml(new Date().toLocaleString())}
        </div>

        <div class="score">
          ${document.querySelector("#results h3").textContent}
        </div>

        ${Array.from(document.querySelectorAll("#results .correct, #results .incorrect"))
          .map((el, index) => {

            return `
              <div class="question ${el.className}">

                ${el.innerHTML}

              </div>
            `;

          }).join("")}

        <div class="footer">
          MAP4C Essential Skills Diagnostic
        </div>

        <br>

        <button onclick="window.print()">
          Print / Save as PDF
        </button>

      </body>
      </html>
    `);

    printWindow.document.close();

  }

});

</script>

</body>
</html>
